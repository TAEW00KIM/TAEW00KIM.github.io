<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--paper:#fcfcfb;--ink:#171717;--sub:#737373;--faint:#a3a3a3}
@media(prefers-color-scheme:dark){:root{--paper:#111;--ink:#ededed;--sub:#8f8f8f;--faint:#666}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{max-width:680px;margin:0 auto;padding:96px 24px}
p{margin:0 0 8px}
.sub{color:var(--sub)}
nav{margin-top:32px;padding-top:16px;border-top:1px solid #ebebe9;display:flex;gap:24px}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px}
</style>
</head>
<body>
<main>
<p>페이지를 찾을 수 없습니다.</p>
<p class="sub">Page not found.</p>
<nav><a href="/">홈으로</a><a href="/en/">English home</a></nav>
</main>
</body>
</html>
